# DevMate files MCP server: read-only, sandboxed file tools over MCP Streamable HTTP (POST/GET /mcp).
spring:
  application:
    name: devmate-files-mcp
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${DEVMATE_SHUTDOWN_TIMEOUT:20s}
  ai:
    mcp:
      server:
        name: devmate-files
        version: "@project.version@"
        type: sync
        protocol: streamable
        request-timeout: ${DEVMATE_FILES_MCP_REQUEST_TIMEOUT:30s}
        instructions: >
          Read-only access to source files under the configured allowed roots. Start with folder_overview (what
          kind of project, file types, key files) and folder_tree (layout); use find_files to locate files by
          name, search_code to locate code (contextLines for surrounding lines), list_files for one directory's
          details and read_file to inspect a file (startLine/endLine for large files).
        capabilities:      # tools only: smallest surface
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

server:
  address: ${DEVMATE_FILES_MCP_ADDRESS:127.0.0.1}   # loopback by default; no auth until M13
  port: ${DEVMATE_FILES_MCP_PORT:8091}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

devmate:
  filesystem:
    # Folders always readable. Comma-separated absolute paths via DEVMATE_FILESYSTEM_ALLOWED_ROOTS.
    # May be empty while allow-client-roots is on: every folder is then granted through DevMate's "Allow" popup.
    allowed-roots: ${DEVMATE_FILESYSTEM_ALLOWED_ROOTS:}
    # Also allow the folders an MCP client declares as roots (DevMate: folders you approved in its UI).
    # Any local MCP client can then widen the sandbox for its own session. Set false (and allowed-roots) to lock down.
    allow-client-roots: ${DEVMATE_FILESYSTEM_ALLOW_CLIENT_ROOTS:true}
  http:
    # Browser origins allowed to call /mcp (e.g. MCP Inspector: http://localhost:6274). Empty = none.
    allowed-origins: ${DEVMATE_HTTP_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        # Deny by default. Add 'metrics' (DEVMATE_ACTUATOR_EXPOSURE=health,info,metrics) to read the per-tool
        # timer devmate.mcp.tool.calls at /actuator/metrics/devmate.mcp.tool.calls; it holds no paths or content.
        include: ${DEVMATE_ACTUATOR_EXPOSURE:health, info}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{toolName:-}] "
  level:
    root: INFO
    dev.devmate: INFO
