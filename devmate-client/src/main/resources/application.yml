# DevMate client: base configuration. Environment-specific values come from
# application-{profile}.yml or environment variables (e.g. SERVER_PORT, DEVMATE_*).
spring:
  application:
    name: devmate-client
  threads:
    virtual:
      enabled: true          # Java 25 virtual threads for request handling
  lifecycle:
    timeout-per-shutdown-phase: ${DEVMATE_SHUTDOWN_TIMEOUT:20s}

# ─────────────────────────────────────────────────────────────────────────────
# LLM (ADR-0003). Exactly ONE provider block below is active.
# To switch: comment the active block and uncomment the other. Nothing else changes.
# ─────────────────────────────────────────────────────────────────────────────
devmate:
  llm:
    # ── Option 1 (ACTIVE): Anthropic Claude. Needs env ANTHROPIC_API_KEY ──────
#    provider: anthropic
#    model: ${DEVMATE_LLM_MODEL:claude-sonnet-5-5}

    # ── Option 2: local Ollama (no API key; ollama serve on localhost:11434) ──
     provider: ollama
     model: ${DEVMATE_LLM_MODEL:llama3.2:3b}

  ai:  # provider settings: endpoints and keys only, never secrets in this file
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

---
# Wiring: derived from devmate.llm above. Don't edit; switch providers in the block above.
spring:
  ai:
    retry:                            # Spring AI default is 10 attempts, 2s ×5 backoff: minutes of waiting
      max-attempts: ${DEVMATE_LLM_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    model:
      chat: ${devmate.llm.provider}   # activates only the selected provider's ChatModel
      embedding: none                 # embeddings arrive with RAG (M6)
    anthropic:
      api-key: ${devmate.ai.anthropic.api-key}
      timeout: ${DEVMATE_LLM_TIMEOUT:120s}
      chat:
        model: ${devmate.llm.model}
        max-tokens: 4096
        temperature: 0.1
    ollama:
      base-url: ${devmate.ai.ollama.base-url}
      init:
        pull-model-strategy: never    # never download models implicitly
      chat:
        model: ${devmate.llm.model}
        temperature: 0.1

---
server:
  address: ${DEVMATE_ADDRESS:127.0.0.1}   # loopback by default: the UI can spend LLM tokens and has no auth yet
  port: ${DEVMATE_PORT:8083}
  shutdown: graceful
  servlet:
    session:
      tracking-modes: cookie        # never put the session id in URLs
      timeout: ${DEVMATE_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: strict           # cross-site form posts carry no session: CSRF protection for the UI
  error:
    include-stacktrace: never
    include-message: never

spring.thymeleaf:
  cache: ${DEVMATE_TEMPLATE_CACHE:true}

devmate.ui:
  open-browser: ${DEVMATE_OPEN_BROWSER:true}   # open the UI in the default browser on startup (local desktop only)
  browse-start: ${DEVMATE_BROWSE_START:${user.home}}   # where the folder picker starts browsing

# Folder Q&A: the files MCP server DevMate reads folders through, and limits for tool-using answers.
devmate.mcp.files:
  url: ${DEVMATE_FILES_MCP_URL:http://127.0.0.1:8091/mcp}
  request-timeout: ${DEVMATE_FILES_MCP_TIMEOUT:30s}
devmate.agent:
  max-tool-rounds: ${DEVMATE_AGENT_MAX_TOOL_ROUNDS:8}
  max-tool-result-chars: ${DEVMATE_AGENT_MAX_TOOL_RESULT_CHARS:30000}

---
management:
  endpoints:
    web:
      exposure:
        include: health, info   # deny-by-default: nothing else is exposed
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true          # /actuator/health/liveness and /readiness
  info:
    env:
      enabled: false
    java:
      enabled: true

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{requestId:-}] "
  level:
    root: INFO
    dev.devmate: INFO
