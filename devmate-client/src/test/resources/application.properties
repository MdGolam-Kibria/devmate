# Tests never call a real provider: a dummy key lets the Anthropic ChatModel be created offline.
spring.ai.anthropic.api-key=test-dummy-key
# Tests must never open browser windows.
devmate.ui.open-browser=false
# Tests never contact MCP servers on their own at startup.
devmate.mcp.connect-on-startup=false
# Tests never reach a real MCP server by accident (a files MCP server may be running on 8091 here): closed port.
devmate.mcp.servers.files.url=http://127.0.0.1:1/mcp
